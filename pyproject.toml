[project]
name = "skill-quest"
version = "0.1.0"
description = "A stateful skill-development system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain",
    "langchain-openai",
    "langgraph",
    "python-dotenv",
    "tavily-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_quest"]